[project]
name = "jovanipink-adk"
version = "0.1.0"
description = "A content-addressed Google ADK runtime adapter for reviewed, non-executable Agent Skill bundles."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jovani Pink"}]
dependencies = [
  "google-adk==2.7.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jovanipink_adk"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "hatchling==1.27.0",
    "mypy==1.20.2",
    "pip-audit==2.10.1",
    "ruff==0.15.12",
    "types-jsonschema==4.26.0.20260518",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["google.adk.*"]
ignore_missing_imports = true
