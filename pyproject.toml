[project]
name = "jovanipink-adk"
version = "0.1.0"
description = "A content-addressed Google ADK runtime adapter for reviewed, non-executable Agent Skill bundles."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jovani Pink"}]
dependencies = [
  "google-adk==2.7.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jovanipink_adk"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "hatchling==1.27.0",
    "pip-audit==2.10.1",
]
