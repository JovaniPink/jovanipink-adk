name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install pinned uv
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r requirements-bootstrap-linux.txt
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Check types and lint
        run: |
          uv run --frozen mypy src tests scripts
          uv run --frozen ruff check src tests scripts
          uv run --frozen ruff format --check src tests scripts
      - name: Validate
        run: uv run --frozen python scripts/validate.py
      - name: Build package artifacts from the locked environment
        run: uv build --no-build-isolation --no-sources
      - name: Scan package artifacts
        run: >-
          uv run --frozen python scripts/artifact_scan.py
          dist/jovanipink_adk-0.1.0-py3-none-any.whl
          dist/jovanipink_adk-0.1.0.tar.gz
      - name: Prepare validation evidence directory
        run: mkdir -p validation-artifacts
      - name: Audit installed dependencies
        run: >-
          uv run --frozen pip-audit --local --skip-editable
          --progress-spinner off --format json
          --output validation-artifacts/dependency-audit.json
      - name: Record validation provenance
        run: >-
          uv run --frozen python scripts/write_validation_report.py
          validation-artifacts/validation-report.json
      - name: Upload validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-evidence
          path: |
            validation-artifacts/
            dist/
          if-no-files-found: error
          retention-days: 14
